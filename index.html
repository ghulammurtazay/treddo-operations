<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161616"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TREDDO Operations</title>
<style>
:root{--orange:#ED4323;--black:#161616;--pale:#F1F8FC;--bg:#0d1421;--panel:#1b2636;--panel2:#202d40;--text:#f8fafc;--muted:#9aa8ba;--line:#344154;--green:#22c55e;--red:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}
.sidebar{background:#101827;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px;font-weight:800;font-size:20px;letter-spacing:.5px}.mark{background:var(--orange);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:white;font-weight:900}
.brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:1px;margin-top:3px}
.nav{width:100%;border:0;background:transparent;color:#aeb9c8;text-align:left;padding:12px;border-radius:10px;margin:2px 0;display:flex;gap:10px;align-items:center}.nav.active,.nav:hover{background:#33221f;color:white;outline:1px solid #793123}.nav .ico{width:22px;text-align:center}.sidefoot{position:absolute;bottom:16px;color:var(--muted);font-size:11px}
main{min-width:0;padding:22px;max-width:1500px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.eyebrow{color:var(--orange);font-weight:800;font-size:11px;letter-spacing:1.7px}.top h1{font-size:26px;margin:4px 0}.sub{color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:var(--panel2);color:white;border-radius:9px;padding:10px 13px}.btn.primary{background:var(--orange);border-color:var(--orange);font-weight:700}.btn.danger{color:#fecaca}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:20px 0}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px}.card .label{font-size:12px;color:var(--muted)}.card .value{font-size:25px;font-weight:800;margin:8px 0}.card .hint{font-size:11px;color:var(--green)}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 12px}.sectionhead h2{font-size:17px;margin:0}.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.quick button{background:var(--panel2);border:1px solid var(--line);border-radius:11px;color:white;padding:15px 8px;min-height:85px}.quick b{display:block;margin-top:8px;font-size:12px}.quick span{font-size:22px;color:var(--orange)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:700px;background:var(--panel)}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:12px}th{background:#222f42;color:#e7edf5;position:sticky;top:0}td{color:#d7e0eb}tr:last-child td{border-bottom:0}.empty{text-align:center;padding:28px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;background:#101827;border:1px solid var(--line);border-radius:8px;color:white;padding:11px}.field textarea{min-height:80px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.badge{display:inline-block;border-radius:99px;background:#263449;padding:4px 8px;font-size:11px}.low{color:#fca5a5}.good{color:#86efac}.muted{color:var(--muted)}.hidden{display:none!important}.notice{background:#33221f;border:1px solid #793123;color:#ffd8cf;padding:12px;border-radius:10px;font-size:12px;margin:14px 0}.split{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.bar{height:8px;background:#334155;border-radius:10px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--orange)}.mobilebar{display:none}
@media(max-width:900px){.app{display:block}.sidebar{display:none}main{padding:18px 13px 90px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.top h1{font-size:22px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;padding:8px 4px calc(8px + env(safe-area-inset-bottom));background:#101827;border-top:1px solid var(--line);justify-content:space-around;z-index:10}.mobilebar button{border:0;background:transparent;color:var(--muted);font-size:10px;padding:5px;display:grid;gap:3px;justify-items:center}.mobilebar button.active{color:var(--orange)}.mobilebar span{font-size:19px}.formgrid{grid-template-columns:1fr}.card .value{font-size:21px}}
</style></head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="mark">T</div><div>TREDDO<small>FOOTWEAR OPERATIONS</small></div></div><div id="sidenav"></div><div class="sidefoot">TREDDO • Private business workspace</div></aside>
<main>
<header class="top"><div><div class="eyebrow">TREDDO OPERATIONS</div><h1 id="pageTitle">Dashboard</h1><div class="sub" id="pageSub">Your footwear business at a glance.</div></div><button class="btn" onclick="exportData()">⇩ Backup</button></header>
<div id="content"></div>
</main>
</div>
<nav class="mobilebar" id="mobileNav"></nav>
<script>
const DBKEY='treddo_ops_v1';
const modules=[
['dashboard','▦','Dashboard'],['vendors','♧','Vendors'],['items','⬡','Items & Stock'],['purchases','⇩','Purchases'],['ledger','⇄','Stock Ledger'],['bom','▤','BOM / Recipes'],['production','⚙','Production'],['sales','↗','Wholesale Sales'],['cashbook','₹','Cashbook'],['expenses','＋','Expenses'],['reports','▥','Reports'],['settings','⚙','Backup & Settings']
];
const fields={
vendors:[['id','Vendor ID','text','V001'],['name','Vendor Name','text',''],['category','Category','select','Chemicals|PU Leather|EVA|Glue|Accessories|Packaging|Other'],['contact','Contact Person','text',''],['phone','Phone','tel',''],['email','Email','email',''],['terms','Payment Terms (days)','number','0'],['opening','Opening Balance Payable (PKR)','number','0'],['notes','Notes','textarea','']],
items:[['code','Item Code / SKU','text','RM-001'],['name','Item Name','text',''],['type','Item Type','select','Raw Material|Finished Good|Packaging|Consumable'],['category','Category','text',''],['unit','Base Unit','select','kg|litre|metre|square metre|sheet|pair|piece|roll|drum'],['vendor','Preferred Vendor ID','text',''],['openingQty','Opening Quantity','number','0'],['unitCost','Standard Unit Cost (PKR)','number','0'],['reorder','Reorder Level','number','0'],['colour','Colour','text',''],['size','Size','text',''],['notes','Notes','textarea','']],
purchases:[['ref','PO / Invoice Ref','text','PO-001'],['date','Date','date',''],['vendor','Vendor ID','text','V001'],['vendorInvoice','Vendor Invoice No.','text',''],['code','Item Code','text','RM-001'],['qty','Qty Ordered','number','0'],['received','Qty Received','number','0'],['unitPrice','Unit Price (PKR)','number','0'],['status','Payment Status','select','Unpaid|Part Paid|Paid|Overdue'],['due','Due Date','date',''],['notes','Notes','textarea','']],
ledger:[['date','Date','date',''],['type','Transaction Type','select','Opening Stock|Purchase Receipt|Production Consumption|Production Output|Sales Dispatch|Sales Return|Purchase Return|Adjustment In|Adjustment Out'],['ref','Reference / Batch ID','text',''],['code','Item Code','text',''],['warehouse','Warehouse','text','Main Store'],['in','Quantity In','number','0'],['out','Quantity Out','number','0'],['unitCost','Unit Cost (PKR)','number','0'],['enteredBy','Entered By','text',''],['notes','Notes','textarea','']],
bom:[['sku','Finished SKU','text','FG-001'],['product','Finished Product Name','text',''],['component','Component Item Code','text','RM-001'],['qty','Qty per Pair','number','0'],['unit','Unit','text',''],['notes','Notes','textarea','']],
production:[['batch','Production Batch ID','text','BATCH-001'],['start','Start Date','date',''],['finish','Finish Date','date',''],['sku','Finished SKU','text','FG-001'],['planned','Pairs Planned','number','0'],['good','Pairs Good','number','0'],['rejected','Pairs Rejected','number','0'],['materialCost','Material Cost (PKR)','number','0'],['labour','Labour Cost (PKR)','number','0'],['overhead','Overhead Cost (PKR)','number','0'],['status','Status','select','Planned|In Progress|Completed|On Hold'],['notes','Notes','textarea','']],
sales:[['ref','Sales Order / Invoice','text','SO-001'],['date','Date','date',''],['customer','Customer Name','text',''],['phone','Customer Phone','tel',''],['sku','Finished SKU','text','FG-001'],['colour','Colour','text','Black'],['size','Size','text','41'],['pairs','Pairs','number','0'],['price','Unit Selling Price (PKR)','number','0'],['status','Payment Status','select','Unpaid|Part Paid|Paid|Overdue'],['due','Due Date','date',''],['notes','Notes','textarea','']],
cashbook:[['date','Date','date',''],['id','Transaction ID','text','CB-001'],['direction','Direction','select','Inflow|Outflow'],['account','Account / Method','select','Cash|Bank|Mobile Wallet|Other'],['category','Category','text',''],['party','Related Party','text',''],['ref','Reference','text',''],['amount','Amount (PKR)','number','0'],['notes','Notes','textarea','']],
expenses:[['date','Date','date',''],['id','Expense ID','text','EXP-001'],['category','Category','select','Rent|Utilities|Labour|Transport|Repairs|Office|Packaging|Other'],['description','Description','text',''],['payee','Vendor / Payee','text',''],['method','Payment Method','select','Cash|Bank|Mobile Wallet|Other'],['amount','Amount (PKR)','number','0'],['paid','Paid?','select','Yes|No|Part Paid'],['ref','Reference','text',''],['notes','Notes','textarea','']]
};
let data=load(),current='dashboard',editing=null;
function load(){try{return JSON.parse(localStorage.getItem(DBKEY))||{}}catch(e){return {}}}
function save(){localStorage.setItem(DBKEY,JSON.stringify(data))}
function rows(k){return data[k]||[]}
function money(n){return 'Rs. '+Number(n||0).toLocaleString('en-PK',{maximumFractionDigits:2})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stockFor(code){let item=rows('items').find(x=>x.code===code);return Number(item?.openingQty||0)+rows('ledger').filter(x=>x.code===code).reduce((a,x)=>a+Number(x.in||0)-Number(x.out||0),0)}
function itemCost(code){let p=rows('purchases').filter(x=>x.code===code&&Number(x.unitPrice)>0);return p.length?Number(p[p.length-1].unitPrice):Number(rows('items').find(x=>x.code===code)?.unitCost||0)}
function batchCost(x){return Number(x.materialCost||0)+Number(x.labour||0)+Number(x.overhead||0)}
function totals(){let inv=rows('items').reduce((a,x)=>a+stockFor(x.code)*itemCost(x.code),0),sales=rows('sales').reduce((a,x)=>a+Number(x.pairs||0)*Number(x.price||0),0),cogs=rows('sales').reduce((a,x)=>a+Number(x.pairs||0)*itemCost(x.sku),0),cash=rows('cashbook').reduce((a,x)=>a+(x.direction==='Inflow'?1:-1)*Number(x.amount||0),0),purchases=rows('purchases').reduce((a,x)=>a+Number(x.qty||0)*Number(x.unitPrice||0),0),low=rows('items').filter(x=>stockFor(x.code)<=Number(x.reorder||0)).length;return {inv,sales,gp:sales-cogs,cash,purchases,low,vendors:rows('vendors').length,items:rows('items').length,production:rows('production').reduce((a,x)=>a+batchCost(x),0)}}
function nav(){document.getElementById('sidenav').innerHTML=modules.map(m=>`<button class="nav ${current===m[0]?'active':''}" onclick="go('${m[0]}')"><span class="ico">${m[1]}</span>${m[2]}</button>`).join('');document.getElementById('mobileNav').innerHTML=modules.filter(m=>['dashboard','items','purchases','production','sales'].includes(m[0])).map(m=>`<button class="${current===m[0]?'active':''}" onclick="go('${m[0]}')"><span>${m[1]}</span>${m[2]}</button>`).join('')}
function go(k){current=k;editing=null;render()}
function render(){nav();let m=modules.find(x=>x[0]===current);document.getElementById('pageTitle').textContent=m?m[2]:'Dashboard';document.getElementById('pageSub').textContent=current==='dashboard'?'Your footwear business at a glance.':'TREDDO operations workspace';let c=document.getElementById('content');if(current==='dashboard')c.innerHTML=dashboard();else if(current==='reports')c.innerHTML=reports();else if(current==='settings')c.innerHTML=settings();else c.innerHTML=moduleView(current); }
function dashboard(){let t=totals();let low=rows('items').filter(x=>stockFor(x.code)<=Number(x.reorder||0));return `<div class="cards">${[['Inventory Value',money(t.inv),'Current estimated stock value'],['Wholesale Sales',money(t.sales),'Recorded invoices'],['Gross Profit Estimate',money(t.gp),'Sales less estimated item cost'],['Net Cash Movement',money(t.cash),'Cashbook inflows less outflows'],['Vendors',t.vendors,'Supplier records'],['Items / SKUs',t.items,'Raw materials and finished goods'],['Low-stock Items',t.low,'At or below reorder level'],['Production Cost',money(t.production),'Recorded batch costs']].map((x,i)=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="hint">${x[2]}</div></div>`).join('')}</div><div class="panel"><div class="sectionhead"><div><h2>Quick Actions</h2><div class="sub">Common factory tasks</div></div></div><div class="quick">${[['＋','Add Vendor','vendors'],['⬡','Add Item','items'],['⇩','Record Purchase','purchases'],['⇄','Stock Movement','ledger'],['▤','Product BOM','bom'],['⚙','Production Batch','production'],['↗','Wholesale Sale','sales'],['₹','Cash Transaction','cashbook']].map(x=>`<button onclick="go('${x[2]}')"><span>${x[0]}</span><b>${x[1]}</b></button>`).join('')}</div></div><div class="split"><div class="panel"><div class="sectionhead"><h2>Low Stock Alerts</h2><button class="btn" onclick="go('items')">View Items</button></div>${low.length?`<div class="tablewrap"><table><thead><tr><th>Item</th><th>On hand</th><th>Reorder at</th></tr></thead><tbody>${low.slice(0,8).map(x=>`<tr><td>${esc(x.name)} <span class="muted">${esc(x.code)}</span></td><td class="low">${stockFor(x.code)}</td><td>${x.reorder||0} ${esc(x.unit||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No low-stock items, or add items and reorder levels to activate alerts.</div>'}</div><div class="panel"><div class="sectionhead"><h2>Recent Activity</h2><span class="badge">Local device</span></div>${recentActivity()}</div></div><div class="notice">Data is stored on this device/browser. Export backups regularly. For shared, multi-user live access, connect this app to a hosted database before using it as the company's official system.</div>`}
function recentActivity(){let all=[];['purchases','ledger','production','sales','cashbook','expenses'].forEach(k=>rows(k).slice(-3).forEach(x=>all.push({kind:k,date:x.date||x.start||'',label:x.ref||x.batch||x.id||x.type||x.customer||x.description||k})));all.sort((a,b)=>String(b.date).localeCompare(String(a.date)));return all.length?all.slice(0,7).map(x=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><b>${esc(x.kind.replace('ledger','Stock movement'))}</b><div class="sub">${esc(x.label)} · ${esc(x.date)}</div></div>`).join(''):'<div class="empty">Your latest transactions will appear here.</div>'}
function moduleView(k){let fs=fields[k];if(!fs)return '<div class="panel">Module unavailable.</div>';let list=rows(k);return `<div class="panel"><div class="sectionhead"><div><h2>${modules.find(x=>x[0]===k)[2]} register</h2><div class="sub">${list.length} records · saved on this device</div></div><button class="btn primary" onclick="showForm('${k}')">＋ Add new</button></div>${editing?formHTML(k):''}${list.length?tableHTML(k,list):'<div class="empty">No records yet. Tap “Add new” to create your first record.</div>'}</div>`}
function formHTML(k){let item=editing.index>=0?rows(k)[editing.index]:{};return `<form onsubmit="submitForm(event,'${k}')" class="panel" style="margin:14px 0"><div class="sectionhead"><h2>${editing.index>=0?'Edit':'New'} ${modules.find(x=>x[0]===k)[2]} record</h2><button type="button" class="btn" onclick="editing=null;render()">Cancel</button></div><div class="formgrid">${fields[k].map(f=>`<div class="field"><label>${f[1]}</label>${f[2]==='select'?`<select name="${f[0]}">${f[3].split('|').map(v=>`<option ${item[f[0]]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`:f[2]==='textarea'?`<textarea name="${f[0]}">${esc(item[f[0]]||'')}</textarea>`:`<input name="${f[0]}" type="${f[2]}" placeholder="${esc(f[3])}" value="${esc(item[f[0]]??(f[2]==='date'?new Date().toISOString().slice(0,10):''))}" ${f[2]==='number'?'step="any"':''}>`}</div>`).join('')}</div><div class="actions"><button class="btn primary" type="submit">Save record</button><button class="btn" type="button" onclick="editing=null;render()">Cancel</button></div></form>`}
function showForm(k,index=-1){editing={key:k,index};render();setTimeout(()=>document.querySelector('form')?.scrollIntoView({behavior:'smooth',block:'start'}),50)}
function submitForm(e,k){e.preventDefault();let obj={};new FormData(e.target).forEach((v,k)=>obj[k]=v);fields[k].forEach(f=>{if(f[2]==='number')obj[f[0]]=Number(obj[f[0]]||0)});if(editing.index>=0)rows(k)[editing.index]=obj;else{data[k]=rows(k);data[k].push(obj)}save();editing=null;render()}
function tableHTML(k,list){let cols=fields[k].slice(0,Math.min(fields[k].length,7));return `<div class="tablewrap"><table><thead><tr>${cols.map(f=>`<th>${f[1]}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${list.map((x,i)=>`<tr>${cols.map(f=>`<td>${esc(x[f[0]]??'')}</td>`).join('')}<td><button class="btn" onclick="showForm('${k}',${i})">Edit</button> <button class="btn danger" onclick="removeRow('${k}',${i})">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function removeRow(k,i){if(confirm('Delete this record? This cannot be undone unless you have a backup.')){rows(k).splice(i,1);save();render()}}
function reports(){let t=totals();return `<div class="cards">${[['Purchases',money(t.purchases)],['Sales',money(t.sales)],['Estimated gross profit',money(t.gp)],['Net cash movement',money(t.cash)]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}</div><div class="panel"><h2>Inventory by item</h2>${rows('items').length?`<div class="tablewrap"><table><thead><tr><th>Code</th><th>Item</th><th>Type</th><th>On hand</th><th>Unit cost</th><th>Estimated value</th><th>Reorder</th></tr></thead><tbody>${rows('items').map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.type)}</td><td>${stockFor(x.code)}</td><td>${money(itemCost(x.code))}</td><td>${money(stockFor(x.code)*itemCost(x.code))}</td><td>${stockFor(x.code)<=Number(x.reorder||0)?'<span class="low">LOW</span>':'OK'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Add items to build inventory reports.</div>'}</div><div class="notice">Financial figures are management estimates. They are not a substitute for reconciled accounting, tax records or a validated inventory valuation method.</div>`}
function settings(){return `<div class="panel"><h2>Data & backups</h2><p class="sub">Export your records as JSON for backup or import a previously exported backup.</p><div class="actions"><button class="btn primary" onclick="exportData()">⇩ Export backup (JSON)</button><label class="btn">⇧ Import backup<input type="file" accept="application/json,.json" style="display:none" onchange="importData(event)"></label><button class="btn" onclick="exportCSV()">Export all tables (CSV files)</button><button class="btn danger" onclick="clearData()">Delete all local data</button></div><div class="notice">Privacy: records stay in this browser's local storage unless you export or share them. Clearing browser data may erase records. Back up frequently and keep the backup in a secure location.</div><h3>Suggested setup</h3><ul><li>Use unique vendor IDs and item codes.</li><li>Record every stock receipt, consumption, production output and dispatch.</li><li>Record actual cash movement separately from invoices.</li><li>Do not count a purchase as stock until the goods are received.</li></ul><p class="sub">Open-source starter app · No subscription or external service required to run locally.</p></div>`}
function exportData(){let blob=new Blob([JSON.stringify({app:'TREDDO Operations',version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});download(blob,'treddo-backup-'+new Date().toISOString().slice(0,10)+'.json')}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.data)throw Error('Invalid backup');if(confirm('Replace current local data with this backup?')){data=x.data;save();render();alert('Backup imported.')}}catch(err){alert('Could not import this file. Please choose a TREDDO JSON backup.')}};r.readAsText(f)}
function exportCSV(){let keys=Object.keys(fields);keys.forEach(k=>{let list=rows(k);let cols=fields[k];let csv=[cols.map(f=>f[1]),...list.map(x=>cols.map(f=>String(x[f[0]]??'').replace(/"/g,'""')))].map(r=>r.map(v=>`"${v}"`).join(',')).join('\r\n');download(new Blob([csv],{type:'text/csv'}),`treddo-${k}.csv`)})}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function clearData(){if(confirm('Permanently delete all TREDDO records stored in this browser? Export a backup first.')){data={};save();render()}}
render();
</script></body></html>
